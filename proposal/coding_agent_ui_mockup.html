<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity VibeForge Enterprise (React & Live REST API Connection)</title>
  
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&family=Fira+Code:wght@400;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --font-sans: 'Inter', -apple-system, sans-serif;
      --font-title: 'Outfit', sans-serif;
      --font-code: 'Fira Code', monospace;
    }

    /* Night (Dark) Theme Variables */
    body.theme-night {
      --bg-dark: #090a0f;
      --menu-bg: #11131c;
      --panel-bg: #161926;
      --panel-border: #23283b;
      --panel-active: #1d2235;
      --primary: #00abf0;
      --cyan: #00e5ff;
      --purple: #ab47bc;
      --success: #00e676;
      --warning: #ff9100;
      --text-main: #f0f3f9;
      --text-muted: #7e8baf;
      --dropdown-bg: #191c2b;
      --dropdown-hover: #262c43;
    }

    /* Day (Light) Theme Variables */
    body.theme-day {
      --bg-dark: #f4f6f9;
      --menu-bg: #ffffff;
      --panel-bg: #ffffff;
      --panel-border: #cbd5e1;
      --panel-active: #e2e8f0;
      --primary: #0284c7;
      --cyan: #0284c7;
      --purple: #9333ea;
      --success: #16a34a;
      --warning: #d97706;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --dropdown-bg: #ffffff;
      --dropdown-hover: #f1f5f9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #090a0f; color: #f0f3f9; font-family: var(--font-sans); height: 100vh; overflow: hidden; display: flex; flex-direction: column; transition: background-color 0.2s, color 0.2s; }

    /* Top Navigation Menu Bar */
    .top-menu-bar { height: 38px; background: var(--menu-bg, #11131c); border-bottom: 1px solid var(--panel-border, #23283b); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; font-size: 0.82rem; user-select: none; flex-shrink: 0; position: relative; z-index: 100; }
    .menu-items { display: flex; gap: 4px; color: var(--text-muted, #7e8baf); align-items: center; }
    .menu-item-btn { padding: 4px 10px; border-radius: 4px; cursor: pointer; transition: background 0.15s, color 0.15s; position: relative; }
    .menu-item-btn:hover, .menu-item-btn.active { background: var(--panel-active, #1d2235); color: var(--text-main, #f0f3f9); }
    .top-title { font-family: var(--font-title); font-weight: 700; color: var(--cyan, #00e5ff); letter-spacing: 0.5px; margin-right: 12px; }
    .sandbox-selector { background: var(--panel-bg, #161926); border: 1px solid var(--panel-border, #23283b); color: var(--cyan, #00e5ff); padding: 3px 10px; border-radius: 4px; font-size: 0.78rem; font-family: var(--font-code); outline: none; }

    /* VS Code Logo Icon */
    .vscode-icon-btn { display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 4px; cursor: pointer; transition: background 0.15s; }
    .vscode-icon-btn:hover { background: var(--panel-active, #1d2235); }

    /* Dropdown Menus */
    .dropdown-menu { position: absolute; top: 32px; left: 0; background: var(--dropdown-bg, #191c2b); border: 1px solid var(--panel-border, #23283b); border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); min-width: 250px; padding: 6px 0; z-index: 200; font-size: 0.8rem; }
    .dropdown-item { padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: var(--text-main, #f0f3f9); }
    .dropdown-item:hover { background: var(--dropdown-hover, #262c43); color: var(--cyan, #00e5ff); }
    .dropdown-shortcut { color: var(--text-muted, #7e8baf); font-size: 0.72rem; font-family: var(--font-code); }
    .dropdown-divider { height: 1px; background: var(--panel-border, #23283b); margin: 4px 0; }

    /* VS Code Extension Marketplace Modal */
    .market-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 999; }
    .market-modal { width: 750px; background: var(--panel-bg, #161926); border: 1px solid var(--panel-border, #23283b); border-radius: 14px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column; }
    .market-header { padding: 18px 22px; background: var(--menu-bg, #11131c); border-bottom: 1px solid var(--panel-border, #23283b); display: flex; justify-content: space-between; align-items: center; }
    .market-title { font-family: var(--font-title); font-size: 1.2rem; font-weight: 700; color: var(--cyan, #00e5ff); display: flex; align-items: center; gap: 10px; }
    .market-search-box { padding: 15px 22px; background: var(--bg-dark, #090a0f); border-bottom: 1px solid var(--panel-border, #23283b); }
    .market-input { width: 100%; padding: 10px 14px; background: var(--panel-bg, #161926); border: 1px solid var(--panel-border, #23283b); border-radius: 8px; color: #fff; font-size: 0.88rem; outline: none; }
    .market-list { max-height: 420px; overflow-y: auto; padding: 15px 22px; display: flex; flex-direction: column; gap: 12px; }
    .market-item { background: var(--bg-dark, #090a0f); border: 1px solid var(--panel-border, #23283b); border-radius: 10px; padding: 14px; display: flex; justify-content: space-between; align-items: center; }
    .market-ext-title { font-weight: 700; color: #fff; font-size: 0.95rem; margin-bottom: 4px; }
    .market-ext-desc { font-size: 0.82rem; color: var(--text-muted, #7e8baf); }
    .btn-install { background: var(--cyan, #00e5ff); color: #000; border: none; padding: 6px 14px; border-radius: 6px; font-weight: 700; font-size: 0.8rem; cursor: pointer; }
    .btn-installed { background: rgba(0, 230, 118, 0.15); color: var(--success, #00e676); border: 1px solid var(--success, #00e676); padding: 6px 14px; border-radius: 6px; font-weight: 700; font-size: 0.8rem; }

    /* Main IDE Resizable Container */
    .ide-body { flex: 1; display: flex; height: calc(100vh - 60px); overflow: hidden; position: relative; }
    .resizer { width: 5px; background: var(--panel-border, #23283b); cursor: col-resize; transition: background 0.2s; flex-shrink: 0; z-index: 10; }
    .resizer:hover, .resizer.dragging { background: var(--cyan, #00e5ff); }

    .panel-header { height: 35px; background: var(--menu-bg, #11131c); border-bottom: 1px solid var(--panel-border, #23283b); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; font-size: 0.78rem; font-weight: 700; color: var(--cyan, #00e5ff); text-transform: uppercase; flex-shrink: 0; }

    /* Left Column: Vibe Prompt & Thinking Stream */
    .left-vibe-column { background: var(--panel-bg, #161926); display: flex; flex-direction: column; height: 100%; overflow: hidden; border-right: 1px solid var(--panel-border, #23283b); }
    .chat-history { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; font-size: 0.88rem; }
    .chat-bubble { background: var(--panel-active, #1d2235); border: 1px solid var(--panel-border, #23283b); border-radius: 10px; padding: 14px; }
    .chat-user { border-left: 3px solid var(--cyan, #00e5ff); }
    .chat-agent { border-left: 3px solid var(--purple, #ab47bc); background: var(--menu-bg, #11131c); }

    .thinking-box { background: rgba(171, 71, 188, 0.08); border: 1px solid rgba(171, 71, 188, 0.3); border-radius: 8px; padding: 10px 12px; margin-top: 10px; font-family: var(--font-code); font-size: 0.78rem; color: var(--purple, #ab47bc); }
    .thinking-header { display: flex; align-items: center; justify-content: space-between; font-weight: 600; margin-bottom: 5px; cursor: pointer; }

    .vibe-prompt-area { padding: 12px 15px; background: var(--menu-bg, #11131c); border-top: 1px solid var(--panel-border, #23283b); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
    .vibe-input-wrapper { display: flex; gap: 10px; }
    .vibe-textarea { flex: 1; background: var(--bg-dark, #090a0f); border: 1px solid var(--panel-border, #23283b); border-radius: 8px; padding: 10px; color: var(--text-main, #f0f3f9); font-family: var(--font-sans); font-size: 0.88rem; resize: none; height: 50px; outline: none; }
    .vibe-textarea:focus { border-color: var(--cyan, #00e5ff); }
    .vibe-submit-btn { background: linear-gradient(135deg, var(--cyan, #00e5ff), var(--primary, #00abf0)); color: #fff; border: none; padding: 0 18px; border-radius: 8px; font-family: var(--font-title); font-weight: 800; font-size: 0.88rem; cursor: pointer; }

    /* Center Column: Main Code Generation & Diff Editor */
    .center-editor-column { background: var(--bg-dark, #090a0f); display: flex; flex-direction: column; height: 100%; overflow: hidden; flex-grow: 1; }
    .editor-container { flex: 1; padding: 15px; font-family: var(--font-code); font-size: 0.85rem; color: var(--text-main, #f0f3f9); overflow-y: auto; }
    .line-add { color: var(--success, #00e676); background: rgba(0, 230, 118, 0.08); display: block; padding: 2px 5px; }

    /* Right Column: Sidebar */
    .right-sidebar-column { background: var(--panel-bg, #161926); display: flex; flex-direction: column; height: 100%; overflow: hidden; border-left: 1px solid var(--panel-border, #23283b); }
    .right-top-controls { background: var(--menu-bg, #11131c); border-bottom: 1px solid var(--panel-border, #23283b); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; font-size: 0.78rem; flex-shrink: 0; }
    .control-group { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .toggle-btn { background: var(--panel-bg, #161926); border: 1px solid var(--panel-border, #23283b); color: var(--text-muted, #7e8baf); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.72rem; }
    .toggle-btn.active { background: rgba(0, 229, 255, 0.15); border-color: var(--cyan, #00e5ff); color: var(--cyan, #00e5ff); font-weight: 700; }

    .explorer-section { flex: 1; display: flex; flex-direction: column; border-bottom: 1px solid var(--panel-border, #23283b); overflow: hidden; }
    .file-list { flex: 1; padding: 8px; overflow-y: auto; font-family: var(--font-code); font-size: 0.78rem; }
    .file-item { padding: 5px 8px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; color: var(--text-muted, #7e8baf); margin-bottom: 2px; }
    .file-item:hover, .file-item.active { background: var(--panel-active, #1d2235); color: var(--text-main, #f0f3f9); }

    .right-bottom-sandbox { height: 210px; background: var(--bg-dark, #090a0f); display: flex; flex-direction: column; flex-shrink: 0; }
    .sandbox-header { height: 30px; background: var(--menu-bg, #11131c); border-bottom: 1px solid var(--panel-border, #23283b); padding: 0 10px; display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; font-family: var(--font-code); color: var(--success, #00e676); }
    .sandbox-terminal { flex: 1; padding: 10px; font-family: var(--font-code); font-size: 0.75rem; color: var(--cyan, #00e5ff); overflow-y: auto; line-height: 1.4; white-space: pre-wrap; }

    /* Bottom Status Bar */
    .bottom-status-bar { height: 22px; background: var(--menu-bg, #11131c); border-top: 1px solid var(--panel-border, #23283b); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; font-size: 0.72rem; color: var(--text-muted, #7e8baf); font-family: var(--font-code); flex-shrink: 0; }
  </style>
</head>
<body class="theme-night">

  <div id="root"></div>

  <!-- React Component Execution with Live REST API Connection -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const BACKEND_API_BASE = "http://localhost:5000";

    function App() {
      const [themeMode, setThemeMode] = useState('night');
      const [fontFamily, setFontFamily] = useState('Inter');
      const [fontSize, setFontSize] = useState(14);
      
      const [openMenu, setOpenMenu] = useState(null);
      const [terminalType, setTerminalType] = useState('Powershell');
      const [isMarketOpen, setIsMarketOpen] = useState(false);
      const [provider, setProvider] = useState('desktop');

      const [leftWidth, setLeftWidth] = useState(50);
      const [rightWidth, setRightWidth] = useState(280);
      const [isDraggingLeft, setIsDraggingLeft] = useState(false);
      const [isDraggingRight, setIsDraggingRight] = useState(false);

      const [thinkingOpen, setThinkingOpen] = useState(true);
      const [vibeInput, setVibeInput] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [backendConnected, setBackendConnected] = useState(false);

      // Real Data States connected to REST API
      const [chatHistory, setChatHistory] = useState([
        { role: 'user', content: '사용자 인증 서비스 auth_service.py의 동기 DB 조회를 비동기 Async SQLAlchemy 구조로 변경하고, pytest로 자율 검증해 줘.' },
        { 
          role: 'agent', 
          content: '요청하신 비동기 JWT 로그인 및 DB 조회 리팩토링 작업을 시작합니다.',
          thinking: [
            "1. Vibe 자연어 의도 분석 ➔ 대상 파일: auth_service.py 식별",
            "2. 동기 조회를 AsyncSession 비동기 구조로 변환 규칙 적용",
            "3. 샌드박스 pytest 자동 검증 트리거 (tests/test_auth.py)",
            "4. AsyncSession await 미적용 오류 스택트레이스 파싱 ➔ 셀프코렉션 보정 완료"
          ]
        }
      ]);

      const [codeDiff, setCodeDiff] = useState(`async def authenticate_user(db: AsyncSession, credentials: UserLogin):\n+   async with db.begin():\n+       result = await db.execute(select(User).where(User.email == credentials.email))\n+       user = result.scalars().first()\n+       if not user or not await verify_password_async(credentials.password, user.password_hash):\n+           raise HTTPException(status_code=400, detail="Invalid credentials")\n    return user`);

      const [terminalLog, setTerminalLog] = useState("[Sandbox] Running 'pytest tests/test_auth.py'...\n[FAILED] TypeError: object AuthSession can't be used in 'await'\n[Self-Correction] Injecting async session context manager.\n[Sandbox] Re-running 'pytest tests/test_auth.py'...\n[SUCCESS] 4 passed in 0.35s. Vibe Self-correction done!");

      // 1. Initial Backend Connection Check
      useEffect(() => {
        fetch(`${BACKEND_API_BASE}/api/workspace/status`)
          .then(res => res.json())
          .then(data => {
            setBackendConnected(true);
            setProvider(data.llm_provider || 'desktop');
          })
          .catch(() => setBackendConnected(false));
      }, []);

      // 2. Handle Vibe Intent Submission to FastAPI Backend
      const handleVibeSubmit = async () => {
        if (!vibeInput.trim()) return;
        
        const currentPrompt = vibeInput;
        setVibeInput('');
        setIsLoading(true);

        // Append User Chat
        const updatedChat = [...chatHistory, { role: 'user', content: currentPrompt }];
        setChatHistory(updatedChat);

        try {
          // Call REST API Endpoint
          const response = await fetch(`${BACKEND_API_BASE}/api/vibe/generate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              intent: currentPrompt,
              target_file: 'auth_service.py',
              provider: provider
            })
          });

          const data = await response.json();
          
          setChatHistory([
            ...updatedChat,
            {
              role: 'agent',
              content: `[Vibe Engine] 요청하신 '${data.code_filename || '파일'}'의 자율 리팩토링 및 샌드박스 검증이 완수되었습니다.`,
              thinking: data.thinking || []
            }
          ]);

          if (data.code_diff) setCodeDiff(data.code_diff);
          if (data.terminal_log) setTerminalLog(data.terminal_log);

        } catch (err) {
          // Local Fallback simulation if backend server is starting
          setChatHistory([
            ...updatedChat,
            {
              role: 'agent',
              content: `[Desktop Engine (Fallback)] '${currentPrompt}'에 대한 자율 Vibe 생성을 완료했습니다.`,
              thinking: [
                "1. Vibe 파서 활성화: 자연어 요구사항 토큰화",
                "2. AST 구문 트리 검토 ➔ 안전 비동기 파이프라인 주입",
                "3. 로컬 샌드박스 pytest 자동 검증 및 커밋 완료"
              ]
            }
          ]);
        } finally {
          setIsLoading(false);
        }
      };

      // 3. Handle Provider Switching
      const handleProviderSwitch = (newProvider) => {
        setProvider(newProvider);
        if (backendConnected) {
          fetch(`${BACKEND_API_BASE}/api/provider/switch`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ provider: newProvider })
          });
        }
      };

      useEffect(() => {
        document.body.className = '';
        if (themeMode === 'night') document.body.classList.add('theme-night');
        else if (themeMode === 'day') document.body.classList.add('theme-day');
      }, [themeMode]);

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (isDraggingLeft) {
            const newPercentage = (e.clientX / window.innerWidth) * 100;
            if (newPercentage > 20 && newPercentage < 70) setLeftWidth(newPercentage);
          }
          if (isDraggingRight) {
            const newRightWidth = window.innerWidth - e.clientX;
            if (newRightWidth > 200 && newRightWidth < 500) setRightWidth(newRightWidth);
          }
        };
        const handleMouseUp = () => {
          setIsDraggingLeft(false);
          setIsDraggingRight(false);
        };
        if (isDraggingLeft || isDraggingRight) {
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
        }
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [isDraggingLeft, isDraggingRight]);

      return (
        <div style={{ display: 'flex', flexDirection: 'column', height: '100vh', fontFamily: fontFamily }} onClick={() => openMenu && setOpenMenu(null)}>
          
          <div className="top-menu-bar" onClick={(e) => e.stopPropagation()}>
            <div className="menu-items">
              <span className="top-title">VibeForge AI</span>
              
              <div className={`menu-item-btn ${openMenu === 'file' ? 'active' : ''}`} onClick={() => setOpenMenu(openMenu === 'file' ? null : 'file')}>
                File
                {openMenu === 'file' && (
                  <div className="dropdown-menu">
                    <div className="dropdown-item">👤 사용자 로그인 (Login)...</div>
                    <div className="dropdown-item">⚙️ 워크스페이스 설정 (Workspace Settings)</div>
                    <div className="dropdown-divider"></div>
                    <div className="dropdown-item">📁 폴더 선택 (Open Folder)... <span className="dropdown-shortcut">Ctrl+K O</span></div>
                    <div className="dropdown-item">🕒 최근 폴더 히스토리 (Recent Folders) ➔</div>
                    <div className="dropdown-item">📄 파일 불러오기 (Open File)... <span className="dropdown-shortcut">Ctrl+O</span></div>
                    <div className="dropdown-divider"></div>
                    <div className="dropdown-item">💾 저장하기 (Save) <span className="dropdown-shortcut">Ctrl+S</span></div>
                    <div className="dropdown-item">💾 다른 이름으로 저장 (Save As)... <span className="dropdown-shortcut">Ctrl+Shift+S</span></div>
                  </div>
                )}
              </div>

              <div className={`menu-item-btn ${openMenu === 'edit' ? 'active' : ''}`} onClick={() => setOpenMenu(openMenu === 'edit' ? null : 'edit')}>
                Edit
                {openMenu === 'edit' && (
                  <div className="dropdown-menu">
                    <div className="dropdown-item">↩️ 실행 취소 (Undo) <span className="dropdown-shortcut">Ctrl+Z</span></div>
                    <div className="dropdown-item">↪️ 다시 실행 (Redo) <span className="dropdown-shortcut">Ctrl+Y</span></div>
                    <div className="dropdown-divider"></div>
                    <div className="dropdown-item">✂️ 잘라내기 (Cut) <span className="dropdown-shortcut">Ctrl+X</span></div>
                    <div className="dropdown-item">📋 복사 (Copy) <span className="dropdown-shortcut">Ctrl+C</span></div>
                    <div className="dropdown-item">📥 붙여넣기 (Paste) <span className="dropdown-shortcut">Ctrl+V</span></div>
                    <div className="dropdown-divider"></div>
                    <div className="dropdown-item">🔍 찾기 (Find)... <span className="dropdown-shortcut">Ctrl+F</span></div>
                    <div className="dropdown-item">🔄 바꾸기 (Replace)... <span className="dropdown-shortcut">Ctrl+H</span></div>
                    <div className="dropdown-item">전체 선택 (Select All) <span className="dropdown-shortcut">Ctrl+A</span></div>
                  </div>
                )}
              </div>

              <div className={`menu-item-btn ${openMenu === 'selection' ? 'active' : ''}`} onClick={() => setOpenMenu(openMenu === 'selection' ? null : 'selection')}>
                Selection
                {openMenu === 'selection' && (
                  <div className="dropdown-menu" style={{ width: '250px' }}>
                    <div style={{ padding: '8px 16px', fontWeight: 'bold', color: 'var(--cyan)' }}>🔤 Font Family 변경</div>
                    <div className="dropdown-item" onClick={() => setFontFamily('Inter')}>Inter {fontFamily === 'Inter' && '✔'}</div>
                    <div className="dropdown-item" onClick={() => setFontFamily('Fira Code')}>Fira Code (Monospace) {fontFamily === 'Fira Code' && '✔'}</div>
                    <div className="dropdown-item" onClick={() => setFontFamily('Outfit')}>Outfit {fontFamily === 'Outfit' && '✔'}</div>
                    <div className="dropdown-item" onClick={() => setFontFamily('Roboto')}>Roboto {fontFamily === 'Roboto' && '✔'}</div>
                    <div className="dropdown-divider"></div>
                    <div style={{ padding: '8px 16px', fontWeight: 'bold', color: 'var(--cyan)' }}>📏 Font Size 변경</div>
                    <div className="dropdown-item" onClick={() => setFontSize(12)}>12px (Small) {fontSize === 12 && '✔'}</div>
                    <div className="dropdown-item" onClick={() => setFontSize(14)}>14px (Normal) {fontSize === 14 && '✔'}</div>
                    <div className="dropdown-item" onClick={() => setFontSize(16)}>16px (Large) {fontSize === 16 && '✔'}</div>
                  </div>
                )}
              </div>

              <div className="menu-item-btn" onClick={() => setIsMarketOpen(true)} style={{ color: 'var(--cyan)', fontWeight: 'bold' }}>
                🛒 Extensions Market
              </div>

              <span className="menu-item-btn">Help</span>
              <span className="menu-item-btn">Setting</span>
            </div>

            <div style={{ display: 'flex', gap: '12px', alignItems: 'center' }}>
              <div style={{ display: 'flex', gap: '4px', background: 'var(--panel-bg)', padding: '2px', borderRadius: '6px', border: '1px solid var(--panel-border)' }}>
                <button className={`toggle-btn ${themeMode === 'night' ? 'active' : ''}`} onClick={() => setThemeMode('night')}>🌙 Night</button>
                <button className={`toggle-btn ${themeMode === 'day' ? 'active' : ''}`} onClick={() => setThemeMode('day')}>☀️ Day</button>
              </div>

              <select className="sandbox-selector">
                <option>Local Desktop Runner (.venv)</option>
                <option>GCP GKE Sandbox Cluster</option>
                <option>RHOAI SNO On-Premise Node</option>
              </select>

              <div className="vscode-icon-btn" onClick={() => setIsMarketOpen(true)}>
                <svg width="18" height="18" viewBox="0 0 100 100" fill="none">
                  <path d="M72.2 4.6L24.3 27.6L9.8 19.3L1.5 24.3L16.2 50L1.5 75.7L9.8 80.7L24.3 72.4L72.2 95.4L98.5 83V17L72.2 4.6ZM72.2 73.6L34.3 50L72.2 26.4V73.6Z" fill="#0066B8"/>
                </svg>
              </div>
            </div>
          </div>

          <div className="ide-body" style={{ fontSize: `${fontSize}px` }}>
            
            <div className="left-vibe-column" style={{ width: `${leftWidth}%` }}>
              <div className="panel-header">
                <span>✨ Vibe Coding Prompt & Thinking Stream</span>
                <span style={{ fontSize: '0.72rem', color: backendConnected ? 'var(--success)' : 'var(--warning)' }}>
                  ● {backendConnected ? 'API Connected (Port 8000)' : 'Standalone Local Mode'}
                </span>
              </div>

              <div className="chat-history">
                {chatHistory.map((item, idx) => (
                  <div key={idx} className={`chat-bubble ${item.role === 'user' ? 'chat-user' : 'chat-agent'}`}>
                    <strong>{item.role === 'user' ? 'User Vibe Intent:' : 'Agent Response:'}</strong><br />
                    {item.content}
                    
                    {item.thinking && item.thinking.length > 0 && (
                      <div className="thinking-box">
                        <div className="thinking-header" onClick={() => setThinkingOpen(!thinkingOpen)}>
                          <span>💭 Agent Thinking Process</span>
                          <span>{thinkingOpen ? '▲' : '▼'}</span>
                        </div>
                        {thinkingOpen && (
                          <div style={{ marginTop: '5px' }}>
                            {item.thinking.map((step, sIdx) => <div key={sIdx}>{step}</div>)}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                ))}
              </div>

              <div className="vibe-prompt-area">
                <div style={{ fontSize: '0.78rem', color: 'var(--cyan)', fontWeight: 700 }}>자연어 의도(Vibe) 실시간 백엔드 전송:</div>
                <div className="vibe-input-wrapper">
                  <textarea 
                    className="vibe-textarea" 
                    value={vibeInput} 
                    onChange={(e) => setVibeInput(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && !e.shiftKey && (e.preventDefault(), handleVibeSubmit())}
                    placeholder="구현할 Vibe 의도를 입력하고 Enter 또는 버튼을 누르세요..."
                  />
                  <button className="vibe-submit-btn" onClick={handleVibeSubmit} disabled={isLoading}>
                    {isLoading ? '생성 중...' : 'Vibe 실행 ➔'}
                  </button>
                </div>
              </div>
            </div>

            <div className={`resizer ${isDraggingLeft ? 'dragging' : ''}`} onMouseDown={() => setIsDraggingLeft(true)}></div>

            <div className="center-editor-column">
              <div className="panel-header">
                <span>📝 Generated Code & Diff Viewer (auth_service.py)</span>
                <span style={{ fontSize: '0.72rem', color: 'var(--warning)' }}>Diff Status: Modified</span>
              </div>
              <div className="editor-container">
                <div style={{ color: 'var(--text-muted)', marginBottom: '12px', fontSize: '0.78rem' }}>// Editing: src/auth_service.py (Auto-generated by Vibe Engine)</div>
                <pre><code>{codeDiff}</code></pre>
              </div>
            </div>

            <div className={`resizer ${isDraggingRight ? 'dragging' : ''}`} onMouseDown={() => setIsDraggingRight(true)}></div>

            <div className="right-sidebar-column" style={{ width: `${rightWidth}px` }}>
              <div className="right-top-controls">
                <div className="control-group">
                  <span style={{ color: 'var(--text-muted)' }}>LLM Adapter:</span>
                  <div>
                    <button className={`toggle-btn ${provider === 'desktop' ? 'active' : ''}`} onClick={() => handleProviderSwitch('desktop')}>Desktop</button>
                    <button className={`toggle-btn ${provider === 'rhoai_vllm' ? 'active' : ''}`} onClick={() => handleProviderSwitch('rhoai_vllm')}>RHOAI</button>
                  </div>
                </div>

                <div className="control-group">
                  <span style={{ color: 'var(--text-muted)' }}>Sync (.stignore):</span>
                  <span style={{ color: 'var(--success)', fontWeight: 'bold' }}>✔ Protected</span>
                </div>
              </div>

              <div className="explorer-section">
                <div className="panel-header" style={{ height: '30px' }}>
                  <span>📁 Code Files</span>
                  <span style={{ fontSize: '0.7rem', color: 'var(--text-muted)' }}>6 Files</span>
                </div>
                <div className="file-list">
                  <div className="file-item active modified"><span>📄 auth_service.py</span><span style={{ color: 'var(--warning)' }}>M</span></div>
                  <div className="file-item created"><span>📄 test_auth.py</span><span style={{ color: 'var(--success)' }}>U</span></div>
                  <div className="file-item"><span>📄 models.py</span></div>
                  <div className="file-item"><span>📄 config.py</span></div>
                  <div className="file-item"><span>📄 requirements.txt</span></div>
                  <div className="file-item"><span>📄 README.md</span></div>
                </div>
              </div>

              <div className="right-bottom-sandbox">
                <div className="sandbox-header">
                  <span>Terminal: {terminalType}</span>
                  <span style={{ color: 'var(--cyan)' }}>MCP RPC Port: 3000</span>
                </div>
                <div className="sandbox-terminal">
                  {terminalLog}
                </div>
              </div>
            </div>

          </div>

          <div className="bottom-status-bar">
            <div>feature/vibe-coding-agent* | API: {backendConnected ? 'Port 8000 Connected' : 'Local Standby'} | Provider: {provider.toUpperCase()}</div>
            <div>MCP Port: 3000 | OpenRouter Quota: $12.40 / $35.00</div>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
