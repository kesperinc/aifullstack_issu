<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Enterprise Coding Agent OS (React Marketplace & VS Code Icon)</title>
  
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&family=Fira+Code:wght@400;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --font-sans: 'Inter', -apple-system, sans-serif;
      --font-title: 'Outfit', sans-serif;
      --font-code: 'Fira Code', monospace;
    }

    /* Night (Dark) Theme Variables */
    body.theme-night {
      --bg-dark: #090a0f;
      --menu-bg: #11131c;
      --panel-bg: #161926;
      --panel-border: #23283b;
      --panel-active: #1d2235;
      --primary: #00abf0;
      --cyan: #00e5ff;
      --purple: #ab47bc;
      --success: #00e676;
      --warning: #ff9100;
      --text-main: #f0f3f9;
      --text-muted: #7e8baf;
      --dropdown-bg: #191c2b;
      --dropdown-hover: #262c43;
    }

    /* Day (Light) Theme Variables */
    body.theme-day {
      --bg-dark: #f4f6f9;
      --menu-bg: #ffffff;
      --panel-bg: #ffffff;
      --panel-border: #cbd5e1;
      --panel-active: #e2e8f0;
      --primary: #0284c7;
      --cyan: #0284c7;
      --purple: #9333ea;
      --success: #16a34a;
      --warning: #d97706;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --dropdown-bg: #ffffff;
      --dropdown-hover: #f1f5f9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-dark); color: var(--text-main); font-family: var(--font-sans); height: 100vh; overflow: hidden; display: flex; flex-direction: column; transition: background-color 0.2s, color 0.2s; }

    /* Top Navigation Menu Bar */
    .top-menu-bar { height: 38px; background: var(--menu-bg); border-bottom: 1px solid var(--panel-border); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; font-size: 0.82rem; user-select: none; flex-shrink: 0; position: relative; z-index: 100; }
    .menu-items { display: flex; gap: 4px; color: var(--text-muted); align-items: center; }
    .menu-item-btn { padding: 4px 10px; border-radius: 4px; cursor: pointer; transition: background 0.15s, color 0.15s; position: relative; }
    .menu-item-btn:hover, .menu-item-btn.active { background: var(--panel-active); color: var(--text-main); }
    .top-title { font-family: var(--font-title); font-weight: 700; color: var(--cyan); letter-spacing: 0.5px; margin-right: 12px; }
    .sandbox-selector { background: var(--panel-bg); border: 1px solid var(--panel-border); color: var(--cyan); padding: 3px 10px; border-radius: 4px; font-size: 0.78rem; font-family: var(--font-code); outline: none; }

    /* VS Code Logo Icon */
    .vscode-icon-btn { display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 4px; cursor: pointer; transition: background 0.15s; }
    .vscode-icon-btn:hover { background: var(--panel-active); }

    /* Dropdown Menus */
    .dropdown-menu { position: absolute; top: 32px; left: 0; background: var(--dropdown-bg); border: 1px solid var(--panel-border); border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); min-width: 250px; padding: 6px 0; z-index: 200; font-size: 0.8rem; }
    .dropdown-item { padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: var(--text-main); }
    .dropdown-item:hover { background: var(--dropdown-hover); color: var(--cyan); }
    .dropdown-shortcut { color: var(--text-muted); font-size: 0.72rem; font-family: var(--font-code); }
    .dropdown-divider { height: 1px; background: var(--panel-border); margin: 4px 0; }

    /* VS Code Extension Marketplace Modal */
    .market-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 999; }
    .market-modal { width: 750px; background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 14px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column; }
    .market-header { padding: 18px 22px; background: var(--menu-bg); border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; align-items: center; }
    .market-title { font-family: var(--font-title); font-size: 1.2rem; font-weight: 700; color: var(--cyan); display: flex; align-items: center; gap: 10px; }
    .market-search-box { padding: 15px 22px; background: var(--bg-dark); border-bottom: 1px solid var(--panel-border); }
    .market-input { width: 100%; padding: 10px 14px; background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; color: #fff; font-size: 0.88rem; outline: none; }
    .market-list { max-height: 420px; overflow-y: auto; padding: 15px 22px; display: flex; flex-direction: column; gap: 12px; }
    .market-item { background: var(--bg-dark); border: 1px solid var(--panel-border); border-radius: 10px; padding: 14px; display: flex; justify-content: space-between; align-items: center; }
    .market-ext-title { font-weight: 700; color: #fff; font-size: 0.95rem; margin-bottom: 4px; }
    .market-ext-desc { font-size: 0.82rem; color: var(--text-muted); }
    .btn-install { background: var(--cyan); color: #000; border: none; padding: 6px 14px; border-radius: 6px; font-weight: 700; font-size: 0.8rem; cursor: pointer; }
    .btn-installed { background: rgba(0, 230, 118, 0.15); color: var(--success); border: 1px solid var(--success); padding: 6px 14px; border-radius: 6px; font-weight: 700; font-size: 0.8rem; }

    /* Main IDE Resizable Container */
    .ide-body { flex: 1; display: flex; height: calc(100vh - 60px); overflow: hidden; position: relative; }
    .resizer { width: 5px; background: var(--panel-border); cursor: col-resize; transition: background 0.2s; flex-shrink: 0; z-index: 10; }
    .resizer:hover, .resizer.dragging { background: var(--cyan); }

    .panel-header { height: 35px; background: var(--menu-bg); border-bottom: 1px solid var(--panel-border); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; font-size: 0.78rem; font-weight: 700; color: var(--cyan); text-transform: uppercase; flex-shrink: 0; }

    /* Left Column: Vibe Prompt & Thinking Stream */
    .left-vibe-column { background: var(--panel-bg); display: flex; flex-direction: column; height: 100%; overflow: hidden; border-right: 1px solid var(--panel-border); }
    .chat-history { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; font-size: 0.88rem; }
    .chat-bubble { background: var(--panel-active); border: 1px solid var(--panel-border); border-radius: 10px; padding: 14px; }
    .chat-user { border-left: 3px solid var(--cyan); }
    .chat-agent { border-left: 3px solid var(--purple); background: var(--menu-bg); }

    .thinking-box { background: rgba(171, 71, 188, 0.08); border: 1px solid rgba(171, 71, 188, 0.3); border-radius: 8px; padding: 10px 12px; margin-top: 10px; font-family: var(--font-code); font-size: 0.78rem; color: var(--purple); }
    .thinking-header { display: flex; align-items: center; justify-content: space-between; font-weight: 600; margin-bottom: 5px; cursor: pointer; }

    .vibe-prompt-area { padding: 12px 15px; background: var(--menu-bg); border-top: 1px solid var(--panel-border); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
    .vibe-input-wrapper { display: flex; gap: 10px; }
    .vibe-textarea { flex: 1; background: var(--bg-dark); border: 1px solid var(--panel-border); border-radius: 8px; padding: 10px; color: var(--text-main); font-family: var(--font-sans); font-size: 0.88rem; resize: none; height: 50px; outline: none; }
    .vibe-textarea:focus { border-color: var(--cyan); }
    .vibe-submit-btn { background: linear-gradient(135deg, var(--cyan), var(--primary)); color: #fff; border: none; padding: 0 18px; border-radius: 8px; font-family: var(--font-title); font-weight: 800; font-size: 0.88rem; cursor: pointer; }

    /* Center Column: Main Code Generation & Diff Editor */
    .center-editor-column { background: var(--bg-dark); display: flex; flex-direction: column; height: 100%; overflow: hidden; flex-grow: 1; }
    .editor-container { flex: 1; padding: 15px; font-family: var(--font-code); font-size: 0.85rem; color: var(--text-main); overflow-y: auto; }
    .line-add { color: var(--success); background: rgba(0, 230, 118, 0.08); display: block; padding: 2px 5px; }

    /* Right Column: Sidebar */
    .right-sidebar-column { background: var(--panel-bg); display: flex; flex-direction: column; height: 100%; overflow: hidden; border-left: 1px solid var(--panel-border); }
    .right-top-controls { background: var(--menu-bg); border-bottom: 1px solid var(--panel-border); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; font-size: 0.78rem; flex-shrink: 0; }
    .control-group { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .toggle-btn { background: var(--panel-bg); border: 1px solid var(--panel-border); color: var(--text-muted); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.72rem; }
    .toggle-btn.active { background: rgba(0, 229, 255, 0.15); border-color: var(--cyan); color: var(--cyan); font-weight: 700; }

    .explorer-section { flex: 1; display: flex; flex-direction: column; border-bottom: 1px solid var(--panel-border); overflow: hidden; }
    .file-list { flex: 1; padding: 8px; overflow-y: auto; font-family: var(--font-code); font-size: 0.78rem; }
    .file-item { padding: 5px 8px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; color: var(--text-muted); margin-bottom: 2px; }
    .file-item:hover, .file-item.active { background: var(--panel-active); color: var(--text-main); }

    .right-bottom-sandbox { height: 210px; background: var(--bg-dark); display: flex; flex-direction: column; flex-shrink: 0; }
    .sandbox-header { height: 30px; background: var(--menu-bg); border-bottom: 1px solid var(--panel-border); padding: 0 10px; display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; font-family: var(--font-code); color: var(--success); }
    .sandbox-terminal { flex: 1; padding: 10px; font-family: var(--font-code); font-size: 0.75rem; color: var(--cyan); overflow-y: auto; line-height: 1.4; }

    /* Bottom Status Bar */
    .bottom-status-bar { height: 22px; background: var(--menu-bg); border-top: 1px solid var(--panel-border); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; font-size: 0.72rem; color: var(--text-muted); font-family: var(--font-code); flex-shrink: 0; }
  </style>
</head>
<body class="theme-night">

  <div id="root"></div>

  <!-- React Component Execution -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [themeMode, setThemeMode] = useState('night');
      const [fontFamily, setFontFamily] = useState('Inter');
      const [fontSize, setFontSize] = useState(14);
      
      const [openMenu, setOpenMenu] = useState(null);
      const [terminalType, setTerminalType] = useState('Powershell');
      const [isMarketOpen, setIsMarketOpen] = useState(false);

      const [leftWidth, setLeftWidth] = useState(50);
      const [rightWidth, setRightWidth] = useState(280);
      const [isDraggingLeft, setIsDraggingLeft] = useState(false);
      const [isDraggingRight, setIsDraggingRight] = useState(false);

      const [thinkingOpen, setThinkingOpen] = useState(true);

      useEffect(() => {
        document.body.className = '';
        if (themeMode === 'night') document.body.classList.add('theme-night');
        else if (themeMode === 'day') document.body.classList.add('theme-day');
        else if (themeMode === 'system') {
          const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.body.classList.add(isDark ? 'theme-night' : 'theme-day');
        }
      }, [themeMode]);

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (isDraggingLeft) {
            const newPercentage = (e.clientX / window.innerWidth) * 100;
            if (newPercentage > 20 && newPercentage < 70) setLeftWidth(newPercentage);
          }
          if (isDraggingRight) {
            const newRightWidth = window.innerWidth - e.clientX;
            if (newRightWidth > 200 && newRightWidth < 500) setRightWidth(newRightWidth);
          }
        };
        const handleMouseUp = () => {
          setIsDraggingLeft(false);
          setIsDraggingRight(false);
        };
        if (isDraggingLeft || isDraggingRight) {
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
        }
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [isDraggingLeft, isDraggingRight]);

      const toggleMenu = (menuName) => {
        setOpenMenu(openMenu === menuName ? null : menuName);
      };

      return (
        <div style={{ display: 'flex', flexDirection: 'column', height: '100vh', fontFamily: fontFamily }} onClick={() => openMenu && setOpenMenu(null)}>
          
          <!-- 1. Global Navigation Top Bar -->
          <div class="top-menu-bar" onClick={(e) => e.stopPropagation()}>
            <div class="menu-items">
              <span class="top-title">Antigravity Agent OS</span>
              
              <!-- File Menu -->
              <div class={`menu-item-btn ${openMenu === 'file' ? 'active' : ''}`} onClick={() => toggleMenu('file')}>
                File
                {openMenu === 'file' && (
                  <div class="dropdown-menu">
                    <div class="dropdown-item">👤 사용자 로그인 (Login)...</div>
                    <div class="dropdown-item">⚙️ 워크스페이스 설정 (Workspace Settings)</div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item">📁 폴더 선택 (Open Folder)... <span class="dropdown-shortcut">Ctrl+K O</span></div>
                    <div class="dropdown-item">🕒 최근 폴더 히스토리 (Recent Folders) ➔</div>
                    <div class="dropdown-item">📄 파일 불러오기 (Open File)... <span class="dropdown-shortcut">Ctrl+O</span></div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item">💾 저장하기 (Save) <span class="dropdown-shortcut">Ctrl+S</span></div>
                    <div class="dropdown-item">💾 다른 이름으로 저장 (Save As)... <span class="dropdown-shortcut">Ctrl+Shift+S</span></div>
                  </div>
                )}
              </div>

              <!-- Edit Menu -->
              <div class={`menu-item-btn ${openMenu === 'edit' ? 'active' : ''}`} onClick={() => toggleMenu('edit')}>
                Edit
                {openMenu === 'edit' && (
                  <div class="dropdown-menu">
                    <div class="dropdown-item">↩️ 실행 취소 (Undo) <span class="dropdown-shortcut">Ctrl+Z</span></div>
                    <div class="dropdown-item">↪️ 다시 실행 (Redo) <span class="dropdown-shortcut">Ctrl+Y</span></div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item">✂️ 잘라내기 (Cut) <span class="dropdown-shortcut">Ctrl+X</span></div>
                    <div class="dropdown-item">📋 복사 (Copy) <span class="dropdown-shortcut">Ctrl+C</span></div>
                    <div class="dropdown-item">📥 붙여넣기 (Paste) <span class="dropdown-shortcut">Ctrl+V</span></div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item">🔍 찾기 (Find)... <span class="dropdown-shortcut">Ctrl+F</span></div>
                    <div class="dropdown-item">🔄 바꾸기 (Replace)... <span class="dropdown-shortcut">Ctrl+H</span></div>
                    <div class="dropdown-item">전체 선택 (Select All) <span class="dropdown-shortcut">Ctrl+A</span></div>
                  </div>
                )}
              </div>

              <!-- Selection Menu -->
              <div class={`menu-item-btn ${openMenu === 'selection' ? 'active' : ''}`} onClick={() => toggleMenu('selection')}>
                Selection
                {openMenu === 'selection' && (
                  <div class="dropdown-menu" style={{ width: '250px' }}>
                    <div style={{ padding: '8px 16px', fontWeight: 'bold', color: 'var(--cyan)' }}>🔤 Font Family 변경</div>
                    <div class="dropdown-item" onClick={() => setFontFamily('Inter')}>Inter {fontFamily === 'Inter' && '✔'}</div>
                    <div class="dropdown-item" onClick={() => setFontFamily('Fira Code')}>Fira Code (Monospace) {fontFamily === 'Fira Code' && '✔'}</div>
                    <div class="dropdown-item" onClick={() => setFontFamily('Outfit')}>Outfit {fontFamily === 'Outfit' && '✔'}</div>
                    <div class="dropdown-item" onClick={() => setFontFamily('Roboto')}>Roboto {fontFamily === 'Roboto' && '✔'}</div>
                    <div class="dropdown-divider"></div>
                    <div style={{ padding: '8px 16px', fontWeight: 'bold', color: 'var(--cyan)' }}>📏 Font Size 변경</div>
                    <div class="dropdown-item" onClick={() => setFontSize(12)}>12px (Small) {fontSize === 12 && '✔'}</div>
                    <div class="dropdown-item" onClick={() => setFontSize(14)}>14px (Normal) {fontSize === 14 && '✔'}</div>
                    <div class="dropdown-item" onClick={() => setFontSize(16)}>16px (Large) {fontSize === 16 && '✔'}</div>
                  </div>
                )}
              </div>

              <!-- View Menu -->
              <div class={`menu-item-btn ${openMenu === 'view' ? 'active' : ''}`} onClick={() => toggleMenu('view')}>
                View
                {openMenu === 'view' && (
                  <div class="dropdown-menu">
                    <div class="dropdown-item" onClick={() => document.documentElement.requestFullscreen()}>🖥️ 전체화면 (Fullscreen) <span class="dropdown-shortcut">F11</span></div>
                    <div class="dropdown-item" onClick={() => window.open(window.location.href, '_blank', 'width=1400,height=900')}>🪟 창 분리 (Detach Window)... <span class="dropdown-shortcut">Ctrl+N</span></div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item" onClick={() => { setLeftWidth(50); setRightWidth(280); alert("레이아웃이 초기화되었습니다."); }}>🔄 기본설정 복원 (Reset Layout)</div>
                  </div>
                )}
              </div>

              <span class="menu-item-btn">Go</span>
              <span class="menu-item-btn">Run</span>
              <span class="menu-item-btn">Terminal</span>
              
              <!-- Marketplace Shortcut Menu -->
              <div class="menu-item-btn" onClick={() => setIsMarketOpen(true)} style={{ color: 'var(--cyan)', fontWeight: 'bold' }}>
                🛒 Extensions Market
              </div>

              <span class="menu-item-btn">Help</span>
              <span class="menu-item-btn">Setting</span>
            </div>

            <!-- Top Right: Theme Switcher, Sandbox Selector & VS Code Icon -->
            <div style={{ display: 'flex', gap: '12px', alignItems: 'center' }}>
              <div style={{ display: 'flex', gap: '4px', background: 'var(--panel-bg)', padding: '2px', borderRadius: '6px', border: '1px solid var(--panel-border)' }}>
                <button class={`toggle-btn ${themeMode === 'night' ? 'active' : ''}`} onClick={() => setThemeMode('night')}>🌙 Night</button>
                <button class={`toggle-btn ${themeMode === 'day' ? 'active' : ''}`} onClick={() => setThemeMode('day')}>☀️ Day</button>
                <button class={`toggle-btn ${themeMode === 'system' ? 'active' : ''}`} onClick={() => setThemeMode('system')}>💻 System</button>
              </div>

              <select class="sandbox-selector">
                <option>Local Desktop Runner (.venv)</option>
                <option>GCP GKE Sandbox Cluster</option>
                <option>RHOAI SNO On-Premise Node</option>
              </select>

              <!-- VS Code Official Emblem Icon (Rightmost Placement) -->
              <div class="vscode-icon-btn" title="VS Code Marketplace & Extension Integration" onClick={() => setIsMarketOpen(true)}>
                <svg width="18" height="18" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M72.2 4.6L24.3 27.6L9.8 19.3L1.5 24.3L16.2 50L1.5 75.7L9.8 80.7L24.3 72.4L72.2 95.4L98.5 83V17L72.2 4.6ZM72.2 73.6L34.3 50L72.2 26.4V73.6Z" fill="#0066B8"/>
                  <path d="M72.2 4.6L24.3 27.6L9.8 19.3L1.5 24.3L16.2 50L1.5 75.7L9.8 80.7L24.3 72.4L72.2 95.4L98.5 83V17L72.2 4.6ZM72.2 73.6L34.3 50L72.2 26.4V73.6Z" fill="url(#paint0_linear)"/>
                  <defs>
                    <linearGradient id="paint0_linear" x1="1.5" y1="50" x2="98.5" y2="50" gradientUnits="userSpaceOnUse">
                      <stop stop-color="#007ACC"/>
                      <stop offset="1" stop-color="#1F9CF0"/>
                    </linearGradient>
                  </defs>
                </svg>
              </div>

            </div>
          </div>

          <!-- 2. VS Code Extension Marketplace Modal -->
          {isMarketOpen && (
            <div class="market-modal-overlay" onClick={() => setIsMarketOpen(false)}>
              <div class="market-modal" onClick={(e) => e.stopPropagation()}>
                <div class="market-header">
                  <div class="market-title">
                    <svg width="22" height="22" viewBox="0 0 100 100" fill="none">
                      <path d="M72.2 4.6L24.3 27.6L9.8 19.3L1.5 24.3L16.2 50L1.5 75.7L9.8 80.7L24.3 72.4L72.2 95.4L98.5 83V17L72.2 4.6ZM72.2 73.6L34.3 50L72.2 26.4V73.6Z" fill="#007ACC"/>
                    </svg>
                    VS Code Extensions Marketplace
                  </div>
                  <button style={{ background: 'none', border: 'none', color: 'var(--text-muted)', fontSize: '1.2rem', cursor: 'pointer' }} onClick={() => setIsMarketOpen(false)}>✖</button>
                </div>

                <div class="market-search-box">
                  <input type="text" class="market-input" placeholder="VS Code 확장 마켓플레이스 검색 (예: Continue, Python, Docker, RHOAI)..." />
                </div>

                <div class="market-list">
                  <div class="market-item">
                    <div>
                      <div class="market-ext-title">Continue.dev AI Assistant</div>
                      <div class="market-ext-desc">오픈소스 AI 코딩 익스텐션 & LLM 커넥터 통합 도구</div>
                    </div>
                    <button class="btn-installed">✔ Installed</button>
                  </div>

                  <div class="market-item">
                    <div>
                      <div class="market-ext-title">Red Hat OpenShift AI Connector</div>
                      <div class="market-ext-desc">RHOAI SNO 폐쇄망 vLLM ServingRuntime 1-Click 연동 가속기</div>
                    </div>
                    <button class="btn-install">+ Install</button>
                  </div>

                  <div class="market-item">
                    <div>
                      <div class="market-ext-title">Antigravity MCP Gateway Helper</div>
                      <div class="market-ext-desc">Port 3000 MCP JSON-RPC 라우팅 세션 동기화 익스텐션</div>
                    </div>
                    <button class="btn-installed">✔ Installed</button>
                  </div>

                  <div class="market-item">
                    <div>
                      <div class="market-ext-title">Python & Pylance Language Server</div>
                      <div class="market-ext-desc">파이썬 샌드박스 pytest 자동 검증 및 정적 언어 분석 엔진</div>
                    </div>
                    <button class="btn-installed">✔ Installed</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          <!-- 3. Main Resizable 3-Column IDE Body -->
          <div class="ide-body" style={{ fontSize: `${fontSize}px` }}>
            
            <!-- Left Resizable Section -->
            <div class="left-vibe-column" style={{ width: `${leftWidth}%` }}>
              <div class="panel-header">
                <span>✨ Vibe Coding Prompt & Thinking Stream</span>
                <span style={{ fontSize: '0.72rem', color: 'var(--success)' }}>● Active Session</span>
              </div>

              <div class="chat-history">
                <div class="chat-bubble chat-user">
                  <strong>User Vibe Intent:</strong><br />
                  "사용자 인증 서비스 auth_service.py의 동기 DB 조회를 비동기 Async SQLAlchemy 구조로 변경하고, pytest로 자율 검증해 줘."
                </div>

                <div class="chat-bubble chat-agent">
                  <strong>Agent Response:</strong><br />
                  요청하신 비동기 JWT 로그인 및 DB 조회 리팩토링 작업을 시작합니다.
                  
                  <div class="thinking-box">
                    <div class="thinking-header" onClick={() => setThinkingOpen(!thinkingOpen)}>
                      <span>💭 Agent Thinking Process</span>
                      <span>{thinkingOpen ? '▲' : '▼'}</span>
                    </div>
                    {thinkingOpen && (
                      <div style={{ marginTop: '5px' }}>
                        1. Parse Vibe intent ➔ Identify target file: <code>auth_service.py</code><br />
                        2. Check dependencies ➔ Convert <code>db.query()</code> to <code>await db.execute(select(...))</code><br />
                        3. Trigger local sandbox test ➔ Execute <code>pytest tests/test_auth.py</code><br />
                        4. Inspect error log ➔ Apply async context manager self-correction.
                      </div>
                    )}
                  </div>
                </div>
              </div>

              <div class="vibe-prompt-area">
                <div style={{ fontSize: '0.78rem', color: 'var(--cyan)', fontWeight: 700 }}>자연어 의도(Vibe) 추가 입력:</div>
                <div class="vibe-input-wrapper">
                  <textarea class="vibe-textarea" placeholder="추가로 구현하거나 수정할 Vibe 의도를 입력하세요..."></textarea>
                  <button class="vibe-submit-btn">Vibe 실행 ➔</button>
                </div>
              </div>
            </div>

            <!-- Left Drag Resizer Bar -->
            <div class={`resizer ${isDraggingLeft ? 'dragging' : ''}`} onMouseDown={() => setIsDraggingLeft(true)}></div>

            <!-- Center Column: Generated Code & Diff Viewer -->
            <div class="center-editor-column">
              <div class="panel-header">
                <span>📝 Generated Code & Diff Viewer (auth_service.py)</span>
                <span style={{ fontSize: '0.72rem', color: 'var(--warning)' }}>Diff Status: Modified</span>
              </div>
              <div class="editor-container">
                <div style={{ color: 'var(--text-muted)', marginBottom: '12px', fontSize: '0.78rem' }}>// Editing: src/auth_service.py (Auto-generated by Vibe Engine)</div>
                <pre><code>
{`async def authenticate_user(db: AsyncSession, credentials: UserLogin):`}
<span class="line-add">+   async with db.begin():</span>
<span class="line-add">+       result = await db.execute(select(User).where(User.email == credentials.email))</span>
<span class="line-add">+       user = result.scalars().first()</span>
<span class="line-add">+       if not user or not await verify_password_async(credentials.password, user.password_hash):</span>
<span class="line-add">+           raise HTTPException(status_code=400, detail="Invalid credentials")</span>
{`    return user`}
                </code></pre>
              </div>
            </div>

            <!-- Right Drag Resizer Bar -->
            <div class={`resizer ${isDraggingRight ? 'dragging' : ''}`} onMouseDown={() => setIsDraggingRight(true)}></div>

            <!-- Right Resizable Section -->
            <div class="right-sidebar-column" style={{ width: `${rightWidth}px` }}>
              <div class="right-top-controls">
                <div class="control-group">
                  <span style={{ color: 'var(--text-muted)' }}>LLM Adapter:</span>
                  <div>
                    <button class="toggle-btn active">Desktop</button>
                    <button class="toggle-btn">RHOAI</button>
                  </div>
                </div>

                <div class="control-group">
                  <span style={{ color: 'var(--text-muted)' }}>Sync (.stignore):</span>
                  <span style={{ color: 'var(--success)', fontWeight: 'bold' }}>✔ Protected</span>
                </div>
              </div>

              <div class="explorer-section">
                <div class="panel-header" style={{ height: '30px' }}>
                  <span>📁 Code Files</span>
                  <span style={{ fontSize: '0.7rem', color: 'var(--text-muted)' }}>6 Files</span>
                </div>
                <div class="file-list">
                  <div class="file-item active modified"><span>📄 auth_service.py</span><span style={{ color: 'var(--warning)' }}>M</span></div>
                  <div class="file-item created"><span>📄 test_auth.py</span><span style={{ color: 'var(--success)' }}>U</span></div>
                  <div class="file-item"><span>📄 models.py</span></div>
                  <div class="file-item"><span>📄 config.py</span></div>
                  <div class="file-item"><span>📄 requirements.txt</span></div>
                  <div class="file-item"><span>📄 README.md</span></div>
                </div>
              </div>

              <div class="right-bottom-sandbox">
                <div class="sandbox-header">
                  <span>Terminal: {terminalType}</span>
                  <span style={{ color: 'var(--cyan)' }}>MCP RPC Port: 3000</span>
                </div>
                <div class="sandbox-terminal">
                  [{terminalType}] Executing 'pytest tests/test_auth.py'...<br />
                  [FAILED] TypeError: object AuthSession can't be used in 'await'<br />
                  [Self-Correction] Injecting async session context manager.<br />
                  [{terminalType}] Re-running 'pytest tests/test_auth.py'...<br />
                  <span style={{ color: 'var(--success)' }}>[SUCCESS] 4 passed in 0.35s. Agentic CLI orchestration active!</span>
                </div>
              </div>
            </div>

          </div>

          <!-- 4. Bottom Status Bar -->
          <div class="bottom-status-bar">
            <div>feature/vibe-coding-agent* | Terminal: {terminalType} | Theme: {themeMode.toUpperCase()} | Font: {fontFamily}</div>
            <div>MCP Port: 3000 | OpenRouter Quota: $12.40 / $35.00</div>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
