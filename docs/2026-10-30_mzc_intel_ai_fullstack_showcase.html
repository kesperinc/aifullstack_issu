<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>MZC-Intel Enterprise AI FULL STACK Showcase</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #030712;
    --bg-surface: #0a1124;
    --bg-surface-elevated: #101b38;
    --bg-card: rgba(13, 23, 48, 0.85);
    --bg-card-hover: rgba(20, 36, 75, 0.95);
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-bright: rgba(0, 199, 253, 0.4);
    --border-card: rgba(30, 58, 102, 0.7);
    
    --mzc-blue: #00abf0;
    --intel-blue: #0071c5;
    --intel-cyan: #00c7fd;
    --accent-gold: #fbbf24;
    --accent-emerald: #10b981;
    --accent-purple: #a855f7;

    --text-title: #ffffff;
    --text-body: #e2e8f0;
    --text-muted: #94a3b8;
    --text-dim: #64748b;

    --font-sans: 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-mono: 'Space Mono', ui-monospace, Menlo, Consolas, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #000;
    font-family: var(--font-sans); color: var(--text-body); user-select: none;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  body.hidecursor, body.hidecursor * { cursor: none !important; }

  /* 1920x1080 FHD 표준 캔버스 */
  #stage {
    position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
    transform-origin: center center;
    background: radial-gradient(130% 110% at 0% 0%, rgba(0, 113, 197, 0.18), transparent 50%),
                radial-gradient(120% 120% at 100% 100%, rgba(0, 199, 253, 0.14), transparent 55%),
                radial-gradient(90% 90% at 50% 40%, rgba(0, 30, 80, 0.35), transparent 60%),
                var(--bg-base);
    overflow: hidden;
  }

  /* 상단 리니어 프로그레스 바 */
  .pbar {
    position: absolute; left: 0; top: 0; height: 4px;
    background: linear-gradient(90deg, var(--intel-blue), var(--intel-cyan), var(--mzc-blue));
    z-index: 60; width: 0; box-shadow: 0 0 16px rgba(0, 199, 253, 0.8);
    transition: width 0.08s linear;
  }

  /* ── 상단 네비게이션 탑바 ── */
  .topbar {
    position: absolute; left: 70px; right: 70px; top: 26px; height: 50px;
    display: flex; align-items: center; gap: 16px; z-index: 50;
  }
  .brand {
    display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none;
  }
  .brand-badge {
    width: 42px; height: 42px; border-radius: 10px;
    background: linear-gradient(135deg, var(--intel-blue), var(--intel-cyan));
    border: 1px solid rgba(0, 199, 253, 0.6);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-weight: 900; font-size: 15px; color: #fff;
    box-shadow: 0 0 18px rgba(0, 199, 253, 0.45);
  }
  .brand-title {
    display: flex; align-items: baseline; gap: 8px; white-space: nowrap;
  }
  .brand-title b { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -0.01em; }
  .brand-title span { font-size: 14px; font-family: var(--font-mono); color: var(--intel-cyan); letter-spacing: 0.08em; font-weight: 700; }

  .top-divider { width: 1px; height: 24px; background: rgba(255, 255, 255, 0.15); margin: 0 4px; }
  .top-subtitle {
    font-size: 14px; color: var(--text-muted); font-family: var(--font-sans); letter-spacing: 0.02em;
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .top-subtitle strong { color: #fff; font-weight: 700; }

  /* 섹션 탭 버튼 */
  .sectabs { display: flex; gap: 8px; margin-left: auto; align-items: center; white-space: nowrap; }
  .sectab {
    background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 999px; color: var(--text-muted); font-family: var(--font-sans);
    font-size: 14px; font-weight: 600; padding: 7px 16px; cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .sectab:hover { color: #fff; background: rgba(0, 199, 253, 0.12); border-color: rgba(0, 199, 253, 0.4); }
  .sectab.on {
    color: #fff; background: rgba(0, 199, 253, 0.2); border-color: rgba(0, 199, 253, 0.7);
    box-shadow: 0 0 16px rgba(0, 199, 253, 0.3); font-weight: 700;
  }

  .topright { display: flex; align-items: center; gap: 14px; }
  .live-badge {
    display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 13px;
    color: var(--intel-cyan); border: 1px solid rgba(0, 199, 253, 0.4);
    background: rgba(0, 199, 253, 0.1); border-radius: 999px; padding: 5px 12px;
  }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--intel-cyan); animation: livePulse 1.8s infinite; }
  @keyframes livePulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(1.3); }
  }
  .clock { font-family: var(--font-mono); font-size: 14px; color: var(--text-muted); letter-spacing: 0.08em; }

  /* ── 슬라이드 메인 영역 (상하 104px/80px 넉넉한 뷰포트 확보) ── */
  #slideHost {
    position: absolute; left: 70px; right: 70px; top: 104px; bottom: 80px;
    overflow: hidden; display: flex; align-items: center;
  }
  .slide {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    opacity: 0; visibility: hidden;
    transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex; flex-direction: column;
  }
  .slide.active {
    opacity: 1; visibility: visible; transform: translateY(-50%);
  }

  /* ── 공통 거버닝 타이틀 메시지 (제목과 본문 사이 시원한 50px 여백 형성) ── */
  .slide-header {
    margin-bottom: 50px; flex-shrink: 0;
  }
  .slide-category {
    display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono);
    font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--intel-cyan); margin-bottom: 10px;
  }
  .slide-category::before {
    content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--intel-cyan); box-shadow: 0 0 10px var(--intel-cyan);
  }
  .slide-title {
    font-size: 40px; font-weight: 800; color: #fff; line-height: 1.25;
    letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .slide-title em {
    font-style: normal;
    background: linear-gradient(90deg, #fff, var(--intel-cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .slide-subtitle {
    font-size: 18px; color: var(--text-muted); margin-top: 10px; line-height: 1.5;
    font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ── 하단 컨트롤 바 ── */
  .bottombar {
    position: absolute; left: 70px; right: 70px; bottom: 24px; height: 36px;
    display: flex; align-items: center; justify-content: space-between; z-index: 50;
    border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 8px;
  }
  .bottom-info {
    display: flex; align-items: center; gap: 14px; font-family: var(--font-mono); font-size: 13px;
  }
  .summit-badge {
    color: #fff; background: rgba(0, 113, 197, 0.35); border: 1px solid rgba(0, 199, 253, 0.4);
    padding: 3px 10px; border-radius: 4px; font-size: 11px; letter-spacing: 0.06em; font-weight: 700;
  }
  .counter { color: var(--intel-cyan); font-weight: 700; letter-spacing: 0.08em; }
  .topic-name { color: var(--text-muted); font-family: var(--font-sans); font-size: 14px; font-weight: 500; }

  .dots-nav { display: flex; gap: 8px; align-items: center; }
  .dot-btn {
    width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, 0.2);
    border: none; cursor: pointer; transition: all 0.2s ease;
  }
  .dot-btn:hover { background: rgba(0, 199, 253, 0.6); transform: scale(1.2); }
  .dot-btn.on {
    width: 28px; border-radius: 999px; background: var(--intel-cyan);
    box-shadow: 0 0 12px var(--intel-cyan);
  }

  /* ═════════════════════════════════════════════════════════════
     [LAYOUT 1: 슬라이드 1 - 표지 / GRAND INTRO SHOWCASE]
     ═════════════════════════════════════════════════════════════ */
  .cover-container {
    display: flex; flex-direction: column; justify-content: center;
  }
  .cover-hero {
    text-align: center; margin-bottom: 30px; position: relative;
  }
  .cover-pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(0, 113, 197, 0.25); border: 1px solid rgba(0, 199, 253, 0.5);
    padding: 6px 22px; border-radius: 999px; font-family: var(--font-mono);
    font-size: 14px; font-weight: 700; color: var(--intel-cyan); margin-bottom: 12px;
    box-shadow: 0 0 18px rgba(0, 199, 253, 0.2);
  }
  .cover-title {
    font-size: 54px; font-weight: 900; color: #fff; letter-spacing: -0.03em;
    line-height: 1.15; margin-bottom: 12px;
  }
  .cover-title span.mzc { color: #fff; }
  .cover-title span.intel {
    background: linear-gradient(90deg, var(--intel-cyan), var(--mzc-blue));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .cover-sub {
    font-size: 20px; color: var(--text-muted); font-weight: 500;
    max-width: 1180px; margin: 0 auto; line-height: 1.55;
  }
  .cover-sub strong { color: #fff; font-weight: 700; }

  /* 표지 4계층 가로 카드 4개 */
  .cover-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;
    margin-bottom: 24px; align-items: stretch;
  }
  .cover-card {
    background: var(--bg-card); border: 1px solid var(--border-card);
    border-radius: 16px; padding: 28px 24px; display: flex; flex-direction: column;
    gap: 16px; backdrop-filter: blur(16px); position: relative;
    overflow: hidden; transition: all 0.25s ease;
  }
  .cover-card:hover {
    border-color: var(--intel-cyan); transform: translateY(-3px);
    box-shadow: 0 10px 28px rgba(0, 199, 253, 0.2);
  }
  .cover-card::before {
    content: ''; position: absolute; left: 0; top: 0; right: 0; height: 5px;
    background: var(--card-accent, var(--intel-cyan));
  }
  .cover-card-num {
    font-family: var(--font-mono); font-size: 13px; font-weight: 800;
    color: var(--intel-cyan); letter-spacing: 0.08em;
  }
  .cover-card-title {
    font-size: 22px; font-weight: 800; color: #fff; line-height: 1.3;
  }
  .cover-card-desc {
    font-size: 15.5px; color: var(--text-muted); line-height: 1.55; flex-grow: 1;
  }
  .cover-card-badge {
    align-self: flex-start; background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 6px;
    padding: 6px 14px; font-size: 13.5px; font-family: var(--font-mono);
    color: #fff; font-weight: 700;
  }

  /* 표지 하단 4대 핵심 지표 배너 */
  .cover-kpi-bar {
    background: linear-gradient(90deg, rgba(0, 113, 197, 0.28), rgba(0, 199, 253, 0.2));
    border: 1px solid rgba(0, 199, 253, 0.45); border-radius: 16px;
    padding: 18px 36px; display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 16px; align-items: center; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
  }
  .cover-kpi-item {
    display: flex; flex-direction: column; gap: 4px; border-right: 1px solid rgba(255, 255, 255, 0.12);
    padding-right: 16px;
  }
  .cover-kpi-item:last-child { border-right: none; padding-right: 0; }
  .cover-kpi-num {
    font-size: 36px; font-weight: 900; color: #fff; font-family: var(--font-mono);
    display: flex; align-items: baseline; gap: 4px;
  }
  .cover-kpi-num em {
    font-style: normal; font-size: 18px; color: var(--intel-cyan); font-weight: 700;
  }
  .cover-kpi-label { font-size: 16px; font-weight: 800; color: #fff; }
  .cover-kpi-sub { font-size: 13.5px; color: var(--text-muted); }

  /* ═════════════════════════════════════════════════════════════
     [LAYOUT 2: 슬라이드 2 - 4계층 참조 아키텍처 (Layer Stack)]
     ═════════════════════════════════════════════════════════════ */
  .arch-container {
    display: flex; flex-direction: column; gap: 16px;
  }
  .arch-layer-card {
    background: var(--bg-card); border: 1px solid var(--border-card);
    border-radius: 16px; padding: 20px 30px; display: flex; align-items: center;
    gap: 28px; position: relative; backdrop-filter: blur(14px);
    transition: all 0.25s ease;
  }
  .arch-layer-card:hover {
    border-color: var(--intel-cyan); transform: translateX(5px);
    box-shadow: 0 6px 20px rgba(0, 199, 253, 0.2);
  }
  .arch-layer-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
    border-radius: 16px 0 0 16px; background: var(--layer-accent, var(--intel-cyan));
  }
  .arch-layer-left { width: 250px; flex-shrink: 0; }
  .arch-layer-no {
    font-family: var(--font-mono); font-size: 13.5px; font-weight: 800;
    color: var(--intel-cyan); letter-spacing: 0.08em; margin-bottom: 2px;
  }
  .arch-layer-name { font-size: 23px; font-weight: 800; color: #fff; }
  .arch-layer-sub { font-size: 15px; color: var(--text-muted); margin-top: 3px; }

  .arch-layer-chips { display: flex; flex-wrap: wrap; gap: 12px; flex-grow: 1; }
  .arch-chip {
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px; padding: 10px 18px; font-size: 16px; color: #e2e8f0; font-weight: 600;
  }

  .arch-layer-right {
    width: 250px; flex-shrink: 0; text-align: right;
    display: flex; flex-direction: column; align-items: flex-end; justify-content: center;
    border-left: 1px solid rgba(255, 255, 255, 0.12); padding-left: 22px;
  }
  .arch-val-label { font-size: 13px; color: var(--text-dim); font-family: var(--font-mono); text-transform: uppercase; margin-bottom: 2px; }
  .arch-val-value { font-size: 22px; font-weight: 800; color: var(--accent-emerald); font-family: var(--font-mono); }

  /* ═════════════════════════════════════════════════════════════
     [LAYOUT 3: 좌우 분할 슬라이드 (Slide 3~8 - Split Layout)]
     - 제목-본문 시원한 사이 공간 50px 확보
     - 든든한 세로 볼륨감과 대형 폰트(22px, 16.5px, 52px)
     ═════════════════════════════════════════════════════════════ */
  .split-body {
    display: flex; gap: 32px; align-items: stretch;
  }

  /* 좌측 영역: 든든한 볼륨과 대형 폰트를 가진 3개 피처 카드 */
  .split-left {
    flex: 1.15; display: flex; flex-direction: column; gap: 18px;
    justify-content: space-between;
  }
  .feature-box {
    background: var(--bg-card); border: 1px solid var(--border-card);
    border-radius: 16px; padding: 24px 28px; display: flex; gap: 22px;
    align-items: center; backdrop-filter: blur(14px); transition: all 0.25s ease;
    position: relative; overflow: hidden; min-height: 124px;
  }
  .feature-box:hover {
    border-color: var(--intel-cyan); background: var(--bg-card-hover);
    transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 199, 253, 0.18);
  }
  .feature-box::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
    background: var(--intel-cyan); opacity: 0.8;
  }
  .feature-icon-badge {
    width: 62px; height: 62px; border-radius: 15px; font-size: 28px;
    background: linear-gradient(135deg, rgba(0, 113, 197, 0.4), rgba(0, 199, 253, 0.2));
    border: 1px solid rgba(0, 199, 253, 0.6); display: flex; align-items: center;
    justify-content: center; flex-shrink: 0;
    box-shadow: 0 0 16px rgba(0, 199, 253, 0.25);
  }
  .feature-text { flex-grow: 1; }
  .feature-title { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 6px; letter-spacing: -0.01em; }
  .feature-desc { font-size: 16.5px; color: #cbd5e1; line-height: 1.58; word-break: keep-all; }

  /* 우측 영역: 상단 2대 메트릭(152px) + 하단 인포박스 */
  .split-right {
    flex: 0.85; display: flex; flex-direction: column; gap: 18px;
    justify-content: space-between;
  }

  /* 2대 메트릭 가로 그리드 */
  .metrics-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 18px; height: 152px; flex-shrink: 0;
  }
  .metric-card {
    background: var(--bg-card); border: 1px solid var(--border-card);
    border-radius: 16px; padding: 20px 24px; display: flex; flex-direction: column;
    justify-content: center; backdrop-filter: blur(14px); position: relative;
  }
  .metric-card-top {
    font-size: 15px; font-weight: 700; color: var(--text-muted);
    font-family: var(--font-sans); margin-bottom: 6px; white-space: nowrap;
  }
  .metric-number {
    font-size: 52px; font-weight: 900; line-height: 1.05; margin-bottom: 6px;
    font-family: var(--font-mono); letter-spacing: -0.02em;
  }
  .metric-number.cyan {
    background: linear-gradient(90deg, #fff, var(--intel-cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .metric-number.emerald {
    background: linear-gradient(90deg, #fff, var(--accent-emerald));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .metric-card-note { font-size: 14.5px; color: #94a3b8; font-weight: 500; }

  /* 우측 하단 전문 아키텍처/실측 인포박스 */
  .info-detail-box {
    background: rgba(10, 18, 38, 0.9); border: 1px solid rgba(0, 199, 253, 0.4);
    border-radius: 16px; padding: 22px 26px; display: flex; flex-direction: column;
    justify-content: space-between; flex-grow: 1; min-height: 240px;
    box-shadow: inset 0 0 20px rgba(0, 113, 197, 0.15);
  }
  .info-header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12); padding-bottom: 10px; margin-bottom: 12px; flex-shrink: 0;
  }
  .info-title {
    font-size: 17px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 8px;
  }
  .info-badge {
    font-size: 13px; font-family: var(--font-mono); color: var(--intel-cyan);
    background: rgba(0, 199, 253, 0.16); border: 1px solid rgba(0, 199, 253, 0.5);
    padding: 4px 12px; border-radius: 6px; font-weight: 700;
  }

  /* 테이블 스타일 */
  .info-table { width: 100%; border-collapse: collapse; font-size: 16px; }
  .info-table th {
    text-align: left; color: var(--text-dim); font-family: var(--font-sans);
    padding: 10px 8px; font-weight: 700; font-size: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }
  .info-table td {
    padding: 13px 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    color: var(--text-body); font-weight: 500; font-size: 16px;
  }
  .info-table td.strong { color: #fff; font-weight: 700; font-size: 16px; }
  .info-table td.highlight { color: var(--intel-cyan); font-weight: 700; font-family: var(--font-mono); font-size: 17px; }
  .info-table td.accent { color: var(--accent-emerald); font-weight: 800; font-family: var(--font-mono); font-size: 17px; }

  /* 스텝 파이프라인 스타일 */
  .pipeline-steps {
    display: flex; flex-direction: column; gap: 12px;
  }
  .pipeline-step {
    display: flex; align-items: center; gap: 16px; background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 13px 18px;
    transition: all 0.2s ease;
  }
  .pipeline-step:hover {
    background: rgba(0, 199, 253, 0.08); border-color: rgba(0, 199, 253, 0.3);
  }
  .pipeline-num {
    font-family: var(--font-mono); font-size: 13px; font-weight: 800; color: var(--intel-cyan);
    padding: 5px 12px; border-radius: 6px; background: rgba(0, 199, 253, 0.18);
    border: 1px solid rgba(0, 199, 253, 0.4); white-space: nowrap; flex-shrink: 0;

              <div class="cover-card" style="--card-accent: ${c.accent};">
                <div class="cover-card-num">${c.num}</div>
                <div class="cover-card-title">${c.title}</div>
                <div class="cover-card-desc">${c.desc}</div>
                <div class="cover-card-badge">${c.badge}</div>
              </div>
            `).join('')}
          </div>

          <div class="cover-kpi-bar">
            ${d.kpis.map(k => `
              <div class="cover-kpi-item">
                <div class="cover-kpi-num">${k.num}<em>${k.unit}</em></div>
                <div class="cover-kpi-label">${k.label}</div>
                <div class="cover-kpi-sub">${k.sub}</div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `;
  } else if (d.type === 'arch') {
    // ── Slide 2 4계층 아키텍처 렌더러 ──
    html = `
      <div class="slide active">
        <div class="slide-header">
          <div class="slide-category">${d.cat}</div>
          <h2 class="slide-title">${d.title}</h2>
          <p class="slide-subtitle">${d.sub}</p>
        </div>
        <div class="arch-container">
          ${d.layers.map(l => `
            <div class="arch-layer-card" style="--layer-accent: ${l.accent};">
              <div class="arch-layer-left">
                <div class="arch-layer-no">${l.num}</div>
                <div class="arch-layer-name">${l.name}</div>
                <div class="arch-layer-sub">${l.sub}</div>
              </div>
              <div class="arch-layer-chips">
                ${l.chips.map(c => `<div class="arch-chip">${c}</div>`).join('')}
              </div>
              <div class="arch-layer-right">
                <div class="arch-val-label">${l.valLabel}</div>
                <div class="arch-val-value">${l.valText}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } else if (d.type === 'split') {
    // ── Slide 3~8 좌우 분할 렌더러 (든든한 볼륨 & 대형 폰트) ──
    html = `
      <div class="slide active">
        <div class="slide-header">
          <div class="slide-category">${d.cat}</div>
          <h2 class="slide-title">${d.title}</h2>
          <p class="slide-subtitle">${d.sub}</p>
        </div>
        <div class="split-body">
          <div class="split-left">
            ${d.features.map(f => `
              <div class="feature-box">
                <div class="feature-icon-badge">${f.icon}</div>
                <div class="feature-text">
                  <div class="feature-title">${f.title}</div>
                  <div class="feature-desc">${f.desc}</div>
                </div>
              </div>
            `).join('')}
          </div>
          <div class="split-right">
            <div class="metrics-row">
              ${d.metrics.map(m => `
                <div class="metric-card">
                  <div class="metric-card-top">${m.top}</div>
                  <div class="metric-number ${m.style}">${m.num}</div>
                  <div class="metric-card-note">${m.note}</div>
                </div>
              `).join('')}
            </div>

            <div class="info-detail-box">
              <div class="info-header">
                <div class="info-title">
                  <span>📊</span>
                  <span>${d.infobox.title}</span>
                </div>
                <span class="info-badge">${d.infobox.badge}</span>
              </div>
              ${d.infobox.table ? `
                <table class="info-table">
                  <thead>
                    <tr>
                      <th>${d.infobox.table[0].strong}</th>
                      <th>${d.infobox.table[0].col2}</th>
                      <th>${d.infobox.table[0].col3}</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${d.infobox.table.slice(1).map(r => `
                      <tr>
                        <td class="strong">${r.strong}</td>
                        <td>${r.col2}</td>
                        <td class="${r.col3.includes('절감') || r.col3.includes('향상') ? 'accent' : 'highlight'}">${r.col3}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              ` : ''}
              ${d.infobox.steps ? `
                <div class="pipeline-steps">
                  ${d.infobox.steps.map(s => `
                    <div class="pipeline-step">
                      <div class="pipeline-num">${s.num}</div>
                      <div class="pipeline-name">${s.name}</div>
                      <div class="pipeline-desc">${s.desc}</div>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
            </div>
          </div>
        </div>
      </div>
    `;
  } else if (d.type === 'industry') {
    // ── Slide 9 산업별 구축 사례 렌더러 ──
    html = `
      <div class="slide active">
        <div class="slide-header">
          <div class="slide-category">${d.cat}</div>
          <h2 class="slide-title">${d.title}</h2>
          <p class="slide-subtitle">${d.sub}</p>
        </div>
        <div class="ind-grid">
          ${d.industries.map(ind => `
            <div class="ind-card" style="--ind-accent: ${ind.accent};">
              <div class="ind-cat">${ind.cat}</div>
              <div class="ind-title">${ind.title}</div>
              <div class="ind-sub">${ind.sub}</div>
              <div class="ind-specs">
                ${ind.specs.map(s => `
                  <div class="ind-spec-item">
                    <strong>${s.k}</strong>
                    <span>${s.v}</span>
                  </div>
                `).join('')}
              </div>
              <div class="ind-kpi-box">
                <span class="ind-kpi-label">${ind.kpiLabel}</span>
                <span class="ind-kpi-val">${ind.kpiVal}</span>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } else if (d.type === 'roadmap') {
    // ── Slide 10 로드맵 & CTA 렌더러 ──
    html = `
      <div class="slide active">
        <div class="slide-header">
          <div class="slide-category">${d.cat}</div>
          <h2 class="slide-title">${d.title}</h2>
          <p class="slide-subtitle">${d.sub}</p>
        </div>
        <div class="road-container">
          <div class="road-grid">
            ${d.stages.map(st => `
              <div class="road-card" style="--road-accent: ${st.accent};">
                <div class="road-stage">${st.stage}</div>
                <div class="road-title">${st.title}</div>
                <div class="road-duration">${st.duration}</div>
                <ul class="road-list">
                  ${st.items.map(it => `<li>${it}</li>`).join('')}
                </ul>
              </div>
            `).join('')}
          </div>
          <div class="road-cta">
            <div class="road-cta-left">
              <div class="road-cta-title">${d.ctaTitle}</div>
              <div class="road-cta-sub">${d.ctaSub}</div>
            </div>
            <div class="road-cta-badge">${d.ctaBtn}</div>
          </div>
        </div>
      </div>
    `;
  }

  host.innerHTML = html;
  updateFooter(idx);
}

function updateFooter(idx) {
  const d = SLIDES[idx];
  document.getElementById('slideCounter').textContent = `SLIDE ${String(idx + 1).padStart(2, '0')} / ${String(SLIDES.length).padStart(2, '0')}`;
  
  let topic = 'MZC-Intel AI FULL STACK';
  if (d.type === 'cover') topic = 'Grand Title & Overview';
  else if (d.type === 'arch') topic = 'Reference Architecture';
  else if (d.title) topic = d.title.replace(/<[^>]+>/g, '');
  document.getElementById('slideTopicName').textContent = topic;

  // 상단 네비게이션 탭 동기화
  document.querySelectorAll('.sectab').forEach(t => {
    t.classList.toggle('on', t.dataset.sec === d.sec);
  });

  // 하단 점(Dots) 동기화
  document.querySelectorAll('.dot-btn').forEach((btn, i) => {
    btn.classList.toggle('on', i === idx);
  });
}

function initDots() {
  const nav = document.getElementById('dotsNav');
  nav.innerHTML = '';
  SLIDES.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.className = `dot-btn ${i === 0 ? 'on' : ''}`;
    btn.title = `Slide ${i + 1}`;
    btn.onclick = () => goToSlide(i);
    nav.appendChild(btn);
  });
}

function goToSlide(idx) {
  curIdx = (idx + SLIDES.length) % SLIDES.length;
  renderSlide(curIdx);
  resetProgress();
}

function nextSlide() {
  goToSlide(curIdx + 1);
}

function prevSlide() {
  goToSlide(curIdx - 1);
}

function navToSec(secKey) {
  const targetIdx = SLIDES.findIndex(s => s.sec === secKey);
  if (targetIdx !== -1) {
    goToSlide(targetIdx);
  }
}

/* 프로그레스 바 애니메이션 */
function startProgress() {
  pbarStart = Date.now();
  if (pbarTimer) clearInterval(pbarTimer);
  const pbar = document.getElementById('pbar');

  pbarTimer = setInterval(() => {
    if (!isAuto) return;
    const elapsed = Date.now() - pbarStart;
    const pct = Math.min(100, (elapsed / SLIDE_DURATION) * 100);
    pbar.style.width = pct + '%';
    if (elapsed >= SLIDE_DURATION) {
      clearInterval(pbarTimer);
      nextSlide();
    }
  }, 50);
}

function resetProgress() {
  const pbar = document.getElementById('pbar');
  pbar.style.width = '0%';
  if (isAuto) {
    startProgress();
  }
}

function toggleAuto() {
  isAuto = !isAuto;
  document.body.classList.toggle('auto', isAuto);
  if (isAuto) {
    startProgress();
  } else {
    if (pbarTimer) clearInterval(pbarTimer);
    document.getElementById('pbar').style.width = '0%';
  }
}

/* 1920x1080 뷰포트 반응형 자동 스케일링 */
function autoScale() {
  const stage = document.getElementById('stage');
  const w = window.innerWidth;
  const h = window.innerHeight;
  const scale = Math.min(w / 1920, h / 1080);
  stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

/* 디지털 시계 */
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('clock').textContent = `${h}:${m}:${s}`;
}

/* 키보드 단축키 지원 */
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key === 'n') {
    e.preventDefault();
    nextSlide();
  } else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'p') {
    e.preventDefault();
    prevSlide();
  } else if (e.key >= '1' && e.key <= '9') {
    const target = parseInt(e.key) - 1;
    if (target < SLIDES.length) goToSlide(target);
  } else if (e.key === '0') {
    goToSlide(9);
  } else if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  }
});

/* 마우스 비활성 시 커서 숨김 */
let mouseTimer = null;
window.addEventListener('mousemove', () => {
  document.body.classList.remove('hidecursor');
  if (mouseTimer) clearTimeout(mouseTimer);
  mouseTimer = setTimeout(() => {
    document.body.classList.add('hidecursor');
  }, 4000);
});

window.addEventListener('resize', autoScale);

// 초기화
window.addEventListener('DOMContentLoaded', () => {
  autoScale();
  initDots();
  renderSlide(0);
  startProgress();
  setInterval(updateClock, 1000);
  updateClock();
});
</script>
</body>
</html>
