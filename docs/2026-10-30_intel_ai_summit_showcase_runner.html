<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Intel AI Summit Seoul 2026 - MZC-Intel AI FULL STACK Master Showcase</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #03060f;
    --panel-bg: rgba(6, 14, 28, 0.94);
    --border: rgba(0, 199, 253, 0.28);
    --border-hl: rgba(0, 199, 253, 0.85);
    --intel-blue: #0071C5;
    --intel-cyan: #00C7FD;
    --intel-deep: #001E50;
    --text: #edf2f9;
    --muted: #8c9cb8;
    --font: 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'Space Mono', ui-monospace, Menlo, Consolas, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #000;
    font-family: var(--font); color: var(--text); user-select: none;
  }
  body.hidecursor, body.hidecursor * { cursor: none !important; }

  /* 뷰포트 컨테이너 */
  #frameContainer {
    position: absolute; inset: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
  }
  .show-item {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: none; outline: none; opacity: 0; visibility: hidden;
    transition: opacity 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0.5s;
    background: #000;
  }
  .show-item.active {
    opacity: 1; visibility: visible; z-index: 10;
  }

  /* 비디오 래퍼 */
  #videoWrapper {
    display: flex; align-items: center; justify-content: center; background: #000;
  }
  #articul8Video {
    width: 100%; height: 100%; object-fit: contain; background: #000;
  }
  #videoOverlayPlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.45); cursor: pointer; z-index: 20;
  }
  #videoOverlayPlay.show { display: flex; }
  .play-circle {
    width: 88px; height: 88px; border-radius: 50%;
    background: rgba(0, 199, 253, 0.25); border: 2px solid var(--intel-cyan);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 36px; box-shadow: 0 0 30px rgba(0, 199, 253, 0.5);
    transition: transform 0.2s;
  }
  .play-circle:hover { transform: scale(1.08); background: rgba(0, 199, 253, 0.4); }

  /* 상단 플로팅 헤더 */
  #runnerHeader {
    position: absolute; top: 0; left: 0; right: 0; height: 56px;
    background: var(--panel-bg); backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; z-index: 100;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
    transition: transform 0.3s ease, opacity 0.3s ease;
  }
  #runnerHeader.minimized {
    transform: translateY(-90%);
    opacity: 0.25;
  }
  #runnerHeader:hover {
    transform: translateY(0);
    opacity: 1;
  }

  /* 상단 리니어 프로그레스 바 */
  #headerProgress {
    position: absolute; bottom: 0; left: 0; height: 3px; width: 0%;
    background: linear-gradient(90deg, var(--intel-blue), var(--intel-cyan));
    box-shadow: 0 0 10px var(--intel-cyan);
    transition: width 0.2s linear;
  }

  /* 브랜드 로고 */
  .runner-brand {
    display: flex; align-items: center; gap: 12px; cursor: pointer;
  }
  .intel-pill {
    background: linear-gradient(135deg, var(--intel-blue), var(--intel-cyan));
    color: #fff; font-size: 11px; font-weight: 900; letter-spacing: 0.5px;
    padding: 4px 10px; border-radius: 4px; box-shadow: 0 0 10px rgba(0, 199, 253, 0.4);
  }
  .runner-brand-text {
    font-size: 14px; font-weight: 700; color: #fff;
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .booth-tag {
    font-size: 11px; font-family: var(--mono); color: var(--intel-cyan);
    border: 1px solid rgba(0, 199, 253, 0.4); padding: 2px 6px; border-radius: 4px;
    white-space: nowrap;
  }

  /* 4개 탭 네비게이션 */
  .runner-nav {
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .runner-tab {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 6px; border: 1px solid transparent;
    background: rgba(255, 255, 255, 0.04); color: var(--muted);
    font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s;
    white-space: nowrap;
  }
  .runner-tab:hover {
    color: #fff; background: rgba(255, 255, 255, 0.08);
  }
  .runner-tab.active {
    background: rgba(0, 199, 253, 0.16); border-color: var(--border-hl);
    color: var(--intel-cyan); box-shadow: 0 0 14px rgba(0, 199, 253, 0.25);
  }
  .tab-timer {
    font-family: var(--mono); font-size: 11px; opacity: 0.75;
  }

  /* 컨트롤 버튼 */
  .runner-ctrls {
    display: flex; align-items: center; gap: 8px;
  }
  .ctrl-btn {
    width: 34px; height: 34px; border-radius: 6px;
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border);
    color: #fff; font-size: 13px; display: flex; align-items: center;
    justify-content: center; cursor: pointer; transition: all 0.2s;
  }
  .ctrl-btn:hover {
    background: rgba(0, 199, 253, 0.2); border-color: var(--intel-cyan);
  }

  /* 토스트 */
  #toast {
    position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
    background: rgba(4, 12, 26, 0.92); border: 1px solid var(--intel-cyan);
    color: #fff; padding: 10px 24px; border-radius: 999px; font-size: 13px;
    font-weight: 600; pointer-events: none; opacity: 0; transition: opacity 0.3s;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8); z-index: 200;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<header id="runnerHeader">
  <div id="headerProgress"></div>

  <div class="runner-brand" onclick="togglePause()">
    <span class="intel-pill">INTEL AI SUMMIT 2026</span>
    <span class="runner-brand-text">
      MZC-Intel AI FULL STACK
      <span class="booth-tag">Gold #04</span>
    </span>
  </div>

  <!-- 파트 탭 버튼 -->
  <nav class="runner-nav">
    <button class="runner-tab active" data-index="0">
      <span>① MZC-Intel AI FULL STACK</span>
      <span class="tab-timer" id="timer0">01:50</span>
    </button>
    <button class="runner-tab" data-index="1">
      <span>② Nota on Intel</span>
      <span class="tab-timer" id="timer1">02:00</span>
    </button>
    <button class="runner-tab" data-index="2">
      <span>③ Alioth Coder</span>
      <span class="tab-timer" id="timer2">03:00</span>
    </button>
    <button class="runner-tab video-tab" data-index="3">
      <span>④ Articul8 영상</span>
      <span class="tab-timer" id="timer3">07:03</span>
    </button>
  </nav>

  <!-- 컨트롤 버튼 -->
  <div class="runner-ctrls">
    <button class="ctrl-btn" id="prevShowBtn" title="이전 (P / ←)">◀</button>
    <button class="ctrl-btn" id="pauseShowBtn" title="일시정지 / 재생 (Space)">❚❚</button>
    <button class="ctrl-btn" id="nextShowBtn" title="다음 (N / →)">▶</button>
    <button class="ctrl-btn sound-btn" id="soundBtn" title="음소거 토글 (M)">🔇</button>
    <button class="ctrl-btn" id="fsBtn" title="전체화면 (F)">⛶</button>
  </div>
</header>

<!-- 메인 뷰포트 컨테이너 -->
<main id="frameContainer">
  <iframe class="show-item active" id="frame0" src="2026-10-30_mzc_intel_ai_fullstack_showcase.html"></iframe>
  <iframe class="show-item" id="frame1" src="Nota_Benchmark_Showcase_261015.html"></iframe>
  <iframe class="show-item" id="frame2" src="Alioth_Coder_Showcase_261019_단독실행.html"></iframe>

  <div class="show-item" id="videoWrapper">
    <video id="articul8Video" playsinline preload="auto" muted controls="false"></video>
    <div id="videoOverlayPlay" title="클릭하여 영상 재생"><div class="play-circle">▶</div></div>
  </div>
</main>

<div id="toast">쇼케이스 전환됨</div>

<script>
/* ═════════════════════════════════════════════════════════════
   인텔 AI Summit 2026 쇼케이스 4단계 목록 및 재생 시간
   순서: Intel AI Full Stack -> Nota -> Alioth -> Articul8 영상 -> 무한 루프
   ═════════════════════════════════════════════════════════════ */
const SHOWS = [
  {
    name: 'MZC-Intel AI FULL STACK (10 Slides)',
    type: 'iframe',
    file: '2026-10-30_mzc_intel_ai_fullstack_showcase.html',
    durationSec: 110,
    id: 'frame0'
  },
  {
    name: 'Nota AI 경량화 벤치마크 on Intel',
    type: 'iframe',
    file: 'Nota_Benchmark_Showcase_261015.html',
    durationSec: 120,
    id: 'frame1'
  },
  {
    name: 'Alioth Coder 에어갭 코딩 에이전트',
    type: 'iframe',
    file: 'Alioth_Coder_Showcase_261019_단독실행.html',
    durationSec: 180,
    id: 'frame2'
  },
  {
    name: 'Articul8 Full Stack AI 행사영상',
    type: 'video',
    file: 'Articul8_FullstackAI_행사영상_KR_v2.mp4',
    durationSec: 423,
    id: 'videoWrapper'
  }
];

let currentIndex = 0;
let isPaused = false;
let elapsedSec = 0;
let timerInterval = null;
let toastTimeout = null;

// 비디오 요소
const videoEl = document.getElementById('articul8Video');
const videoOverlay = document.getElementById('videoOverlayPlay');

// 비디오 다중 경로 폴백 리스트
const VIDEO_PATHS = [
  'Articul8_FullstackAI_행사영상_KR_v2.mp4',
  '../Articul8_FullstackAI_행사영상_KR_v2.mp4',
  'C:/Users/MZC01-SUNKIM317/OneDrive/2026/ISSU/Redhat 행사/final/Articul8_FullstackAI_행사영상_KR_v2.mp4'
];

let currentPathIndex = 0;
function tryLoadVideo() {
  if (currentPathIndex < VIDEO_PATHS.length) {
    videoEl.src = VIDEO_PATHS[currentPathIndex];
    videoEl.load();
    currentPathIndex++;
  }
}
videoEl.addEventListener('error', () => {
  if (currentPathIndex < VIDEO_PATHS.length) {
    tryLoadVideo();
  }
});
tryLoadVideo();

videoEl.addEventListener('ended', () => {
  if (currentIndex === 3) switchShow(0);
});

// 커서 자동 숨김
let cursorTimeout = null;
function handleMouseMove() {
  document.body.classList.remove('hidecursor');
  document.getElementById('runnerHeader').classList.remove('minimized');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    if (!isPaused) {
      document.body.classList.add('hidecursor');
      document.getElementById('runnerHeader').classList.add('minimized');
    }
  }, 4000);
}
window.addEventListener('mousemove', handleMouseMove);

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 2200);
}

function updateTabs() {
  const tabs = document.querySelectorAll('.runner-tab');
  tabs.forEach((tab, idx) => {
    tab.classList.toggle('active', idx === currentIndex);
  });
}

function updateProgress() {
  const currentShow = SHOWS[currentIndex];
  let curSec = elapsedSec;
  let totalSec = currentShow.durationSec;

  if (currentShow.type === 'video' && videoEl.duration && !isNaN(videoEl.duration)) {
    curSec = Math.floor(videoEl.currentTime);
    totalSec = Math.floor(videoEl.duration);
  }

  const pct = Math.min(100, (curSec / totalSec) * 100);
  document.getElementById('headerProgress').style.width = pct + '%';

  const remainSec = Math.max(0, totalSec - curSec);
  const m = String(Math.floor(remainSec / 60)).padStart(2, '0');
  const s = String(remainSec % 60).padStart(2, '0');
  const timerEl = document.getElementById(`timer${currentIndex}`);
  if (timerEl) timerEl.textContent = `${m}:${s}`;
}

function switchShow(newIndex, manual = false) {
  if (newIndex < 0) newIndex = SHOWS.length - 1;
  if (newIndex >= SHOWS.length) newIndex = 0;

  // 이전 항목 비활성화
  const prevShow = SHOWS[currentIndex];
  document.getElementById(prevShow.id).classList.remove('active');
  if (prevShow.type === 'video') {
    videoEl.pause();
    videoOverlay.classList.remove('show');
  }

  currentIndex = newIndex;
  elapsedSec = 0;

  // 새 항목 활성화
  const nextShow = SHOWS[currentIndex];
  const nextEl = document.getElementById(nextShow.id);
  nextEl.classList.add('active');

  if (nextShow.type === 'video') {
    videoEl.currentTime = 0;
    const playPromise = videoEl.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => videoOverlay.classList.add('show'));
    }
  }

  updateTabs();
  updateProgress();
  showToast(`${currentIndex + 1}단계: ${nextShow.name}`);
}

function tick() {
  if (isPaused) return;

  const currentShow = SHOWS[currentIndex];
  if (currentShow.type === 'iframe') {
    elapsedSec += 1;
    updateProgress();
    if (elapsedSec >= currentShow.durationSec) {
      switchShow(currentIndex + 1);
    }
  } else if (currentShow.type === 'video') {
    updateProgress();
  }
}

function togglePause() {
  isPaused = !isPaused;
  const pauseBtn = document.getElementById('pauseShowBtn');
  const currentShow = SHOWS[currentIndex];

  if (isPaused) {
    pauseBtn.textContent = '▶';
    if (currentShow.type === 'video') videoEl.pause();
    showToast('일시정지됨 (스페이스바로 재개)');
  } else {
    pauseBtn.textContent = '❚❚';
    if (currentShow.type === 'video') videoEl.play();
    showToast('재생 시작');
  }
}

function toggleSound() {
  videoEl.muted = !videoEl.muted;
  const soundBtn = document.getElementById('soundBtn');
  if (videoEl.muted) {
    soundBtn.textContent = '🔇';
    showToast('음소거 켜짐');
  } else {
    soundBtn.textContent = '🔊';
    showToast('음소거 해제됨');
  }
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}

videoOverlay.addEventListener('click', () => {
  videoOverlay.classList.remove('show');
  videoEl.play();
});

// 이벤트 바인딩
document.querySelectorAll('.runner-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    const idx = parseInt(btn.getAttribute('data-index'), 10);
    switchShow(idx, true);
  });
});

document.getElementById('prevShowBtn').addEventListener('click', () => switchShow(currentIndex - 1, true));
document.getElementById('nextShowBtn').addEventListener('click', () => switchShow(currentIndex + 1, true));
document.getElementById('pauseShowBtn').addEventListener('click', togglePause);
document.getElementById('soundBtn').addEventListener('click', toggleSound);
document.getElementById('fsBtn').addEventListener('click', toggleFullscreen);

// 단축키
window.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    togglePause();
  } else if (e.key === 'ArrowRight' || e.key === 'n' || e.key === 'N') {
    switchShow(currentIndex + 1, true);
  } else if (e.key === 'ArrowLeft' || e.key === 'p' || e.key === 'P') {
    switchShow(currentIndex - 1, true);
  } else if (e.key === 'm' || e.key === 'M') {
    toggleSound();
  } else if (e.key === 'f' || e.key === 'F') {
    toggleFullscreen();
  } else if (['1', '2', '3', '4'].includes(e.key)) {
    const idx = parseInt(e.key, 10) - 1;
    switchShow(idx, true);
  }
});

// 타이머 시작
timerInterval = setInterval(tick, 1000);
updateTabs();
updateProgress();
</script>

</body>
</html>
